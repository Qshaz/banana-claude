name: Deploy Notes App

on:
  push:
    branches: [main, claude/notes-app-apple-import-Tw5Br]
    paths: [notes-app/**/*, .github/workflows/deploy-notes.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: notes-app/package-lock.json

      - run: npm ci
        working-directory: notes-app

      - run: npm run build
        working-directory: notes-app

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: notes-app/dist

      - uses: actions/deploy-pages@v4
        id: deployment

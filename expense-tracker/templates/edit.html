<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Bill</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 480px;
      margin: 0 auto;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    h1 { color: #1a3c5e; font-size: 22px; font-weight: 700; margin-bottom: 28px; }

    label {
      display: block;
      color: #374151;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input, select, textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      color: #1f2937;
      margin-bottom: 20px;
      background: #fff;
      transition: border-color 0.15s;
      font-family: inherit;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #1a3c5e;
    }

    textarea { resize: vertical; min-height: 72px; }

    .bill-image {
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      margin-bottom: 24px;
    }

    .actions { display: flex; gap: 12px; margin-top: 8px; }

    .btn-save {
      flex: 1;
      background: #1a3c5e;
      color: #fff;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-save:hover { background: #142d46; }

    .btn-cancel {
      flex: 1;
      background: #e5e7eb;
      color: #374151;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      display: block;
    }

    .btn-cancel:hover { background: #d1d5db; }
  </style>
</head>
<body>
  <div class="card">
    <h1>✏️ Edit Bill</h1>

    {% if bill.filename %}
    <img src="/image/{{ bill.filename }}" alt="Bill photo" class="bill-image">
    {% endif %}

    <form method="post">
      <label>Vendor / Company</label>
      <input type="text" name="vendor" value="{{ bill.vendor or '' }}" required>

      <label>Category</label>
      <select name="category">
        {% for cat in categories %}
        <option value="{{ cat }}" {% if cat == bill.category %}selected{% endif %}>{{ cat }}</option>
        {% endfor %}
      </select>

      <label>Amount (PKR)</label>
      <input type="number" name="amount" value="{{ bill.amount or 0 }}" step="1" min="0" required>

      <label>Bill Date</label>
      <input type="date" name="bill_date" value="{{ bill.bill_date or '' }}">

      <label>Description</label>
      <textarea name="description">{{ bill.description or '' }}</textarea>

      <label>Notes</label>
      <textarea name="notes" placeholder="Optional notes…">{{ bill.notes or '' }}</textarea>

      <div class="actions">
        <button type="submit" class="btn-save">Save</button>
        <a href="/dashboard" class="btn-cancel">Cancel</a>
      </div>
    </form>
  </div>
</body>
</html>

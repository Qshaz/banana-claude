name: Deploy Notes App

on:
  push:
    branches: [main, claude/notes-app-apple-import-Tw5Br]
    paths: [notes-app/**/*, .github/workflows/deploy-notes.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: notes-app/package-lock.json

      - run: npm ci
        working-directory: notes-app

      - run: npm run build
        working-directory: notes-app

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: notes-app/dist
          branch: gh-pages
          clean: true
